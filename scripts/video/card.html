<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  body { background: radial-gradient(1200px 700px at 75% 20%, #1f4479 0%, transparent 60%), linear-gradient(135deg, #071226, #0b1a33 45%, #17345e); color: #fff; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 180px; }
  .mark { width: 120px; height: 120px; border-radius: 30px; background: linear-gradient(135deg, #2a78d6, #1baf7a); display: grid; place-items: center;
    box-shadow: 0 24px 60px rgba(27,175,122,.25); opacity: 0; transform: scale(.7); animation: pop .9s .2s cubic-bezier(.2,.9,.3,1.2) forwards; }
  h1 { font-size: 112px; margin: 40px 0 0; letter-spacing: -.01em; font-weight: 750; opacity: 0; transform: translateY(24px); animation: up .9s .55s ease forwards; }
  .sub { font-size: 38px; color: #c9d4e6; margin-top: 18px; max-width: 1300px; line-height: 1.3; opacity: 0; transform: translateY(24px); animation: up .9s .85s ease forwards; }
  .tag { font-size: 30px; color: #fff; margin-top: 34px; font-weight: 650; opacity: 0; animation: up .9s 1.2s ease forwards; }
  .foot { position: absolute; left: 180px; right: 180px; bottom: 90px; display: flex; justify-content: space-between; font-size: 24px; color: #8fa3c2;
    opacity: 0; animation: up .9s 1.4s ease forwards; }
  .line { height: 4px; width: 0; margin-top: 46px; border-radius: 4px; background: linear-gradient(90deg, #2a78d6, #1baf7a); animation: grow 1.4s 1s ease forwards; }
  @keyframes pop { to { opacity: 1; transform: none } }
  @keyframes up { to { opacity: 1; transform: none } }
  @keyframes grow { to { width: 420px } }
</style></head>
<body><div class="wrap">
  <div class="mark"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
  <h1>TerraMind AI</h1>
  <div class="sub" id="sub"></div>
  <div class="line"></div>
  <div class="tag" id="tag"></div>
</div>
<div class="foot"><span id="f1"></span><span id="f2"></span></div>
<script>
  const q = new URLSearchParams(location.search);
  for (const k of ['sub', 'tag', 'f1', 'f2']) document.getElementById(k).textContent = q.get(k) || '';
</script>
</body></html>
